spring.application.name=auth-service
server.port=8081

spring.data.mongodb.uri=mongodb://localhost:27017/authdb

# This service's own API key - every service has a DIFFERENT one
app.api.key=auth-service-secret-key

# Must be IDENTICAL to app.jwt.secret in api-gateway/src/main/resources/application.yml
# The gateway verifies the signature with this exact same string.
app.jwt.secret=change-this-to-a-long-random-string-at-least-32-characters
app.jwt.expiration-ms=3600000

springdoc.swagger-ui.path=/swagger-ui.html
